[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scp-tea"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
# Auto-discover common/, models/, perfusion_bioreactor/ (each has __init__.py)
include = ["common*", "models*", "perfusion_bioreactor*"]
